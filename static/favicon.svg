<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="auraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    
    <!-- Flame Fill Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fdf2f8" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#312e81" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#auraBg)" filter="url(#auraGlow)" />
  <rect x="8" y="8" width="112" height="112" rx="30" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.3" />

  <!-- Centered AURA Flame Mark -->
  <g transform="translate(64, 64) scale(3.6) translate(-12, -12)">
    <path
      d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"
      fill="none"
      stroke="url(#flameGrad)"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Inner Core Flame Glow -->
    <path
      d="M12 9.5c.7 1.8 1.8 2.8 1.5 4.5a2.5 2.5 0 0 1-4.2 0c0-.8.6-1.3.8-2 0-.8-.4-1.4-.4-2.2.7-.4 1.3-.9 2.3-1.3z"
      fill="url(#flameGrad)"
      opacity="0.95"
    />
  </g>
</svg>

