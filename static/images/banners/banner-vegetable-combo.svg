<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="vegBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="520" rx="28" fill="url(#vegBg)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="1020" cy="260" r="220" fill="#10b981" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="1120" cy="120" r="140" fill="#34d399" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="120" cy="460" r="180" fill="#047857" opacity="0.3" filter="url(#softGlow)" />

  <!-- Decorative Botanical Geometry Circles -->
  <circle cx="1000" cy="260" r="210" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="8 8" opacity="0.25" />
  <circle cx="1000" cy="260" r="160" fill="none" stroke="#6ee7b7" stroke-width="1.5" opacity="0.2" />

  <!-- LEFT CONTENT AREA -->
  <g transform="translate(80, 0)">
    
    <!-- 1. Offer Pill Badge -->
    <g transform="translate(0, 72)">
      <rect width="320" height="42" rx="21" fill="url(#badgeGold)" />
      <text x="22" y="27" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" fill="#78350f">
        🔥 স্পেশাল অফার • ৩০% পর্যন্ত ছাড়
      </text>
    </g>

    <!-- 2. Main Headline -->
    <text x="0" y="180" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-0.5">
      বিষমুক্ত তাজা সবজি আপনার ছাদবাগানেই!
    </text>

    <!-- 3. Subtitle / Product Highlights -->
    <text x="0" y="235" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#a7f3d0">
      সেরা ১০টি হাই-ইল্ড সবজি বীজের প্রিমিয়াম কম্বো প্যাক
    </text>

    <text x="0" y="272" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16" fill="#d1fae5">
      কালো তাল বেগুন • এরাবিয়ান শসা • লাল শিম • বেগুনি বাঁধাকপি • লাল ঢেঁড়স
    </text>

    <!-- 4. Feature Trust Bullets -->
    <g transform="translate(0, 318)">
      <!-- Bullet 1 -->
      <g>
        <circle cx="14" cy="14" r="14" fill="#047857" />
        <path d="M9 14 L12 17 L19 10" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="36" y="20" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#f0fdf4">
          ১০০% জার্মিনেশন গ্যারান্টি
        </text>
      </g>

      <!-- Bullet 2 -->
      <g transform="translate(240, 0)">
        <circle cx="14" cy="14" r="14" fill="#047857" />
        <path d="M9 14 L12 17 L19 10" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="36" y="20" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#f0fdf4">
          সারা দেশে ক্যাশ অন ডেলিভারি
        </text>
      </g>

      <!-- Bullet 3 -->
      <g transform="translate(500, 0)">
        <circle cx="14" cy="14" r="14" fill="#047857" />
        <path d="M9 14 L12 17 L19 10" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="36" y="20" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#f0fdf4">
          ফ্রি গ্রোয়ারস সাপোর্ট
        </text>
      </g>
    </g>

    <!-- 5. CTA Button Graphic -->
    <g transform="translate(0, 388)">
      <rect width="210" height="54" rx="27" fill="#ffffff" filter="url(#softGlow)" opacity="0.3" />
      <rect width="200" height="52" rx="26" fill="#ffffff" />
      <text x="38" y="33" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="17" fill="#065f46">
        অফারটি দেখুন
      </text>
      <!-- Arrow Icon -->
      <path d="M148 26 L164 26 M158 20 L164 26 L158 32" fill="none" stroke="#065f46" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

  </g>

  <!-- RIGHT VISUAL / SHOWCASE COMPOSITION -->
  <g transform="translate(990, 260)">
    
    <!-- Center Glowing Disc -->
    <circle cx="0" cy="0" r="150" fill="#064e3b" stroke="#10b981" stroke-width="3" />
    <circle cx="0" cy="0" r="130" fill="#047857" opacity="0.6" />

    <!-- Organic Seed & Sprout Graphical Elements -->
    <!-- Large Sprout / Plant Icon -->
    <path d="M-15,60 C-15,10 -50,-30 -70,-40 C-30,-45 0,-10 0,60 Z" fill="#34d399" opacity="0.9" />
    <path d="M10,60 C10,20 45,-20 75,-35 C40,-35 15,0 10,60 Z" fill="#6ee7b7" opacity="0.95" />
    <path d="M0,70 L0,-60 C0,-90 30,-110 50,-115 C30,-90 10,-60 0,70 Z" fill="#a7f3d0" />

    <!-- Floating Badge: Buy 4 Get 1 Free -->
    <g transform="translate(-110, 80)">
      <rect width="220" height="46" rx="23" fill="#0f172a" stroke="#fbbf24" stroke-width="2" />
      <text x="24" y="29" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="15" fill="#fef08a">
        🎁 ৪টি নিলে ১টি ফ্রি!
      </text>
    </g>

    <!-- Floating Mini Badge: Seed Pack -->
    <g transform="translate(-130, -110)">
      <rect width="150" height="38" rx="19" fill="#14532d" stroke="#34d399" stroke-width="1.5" />
      <text x="18" y="24" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#ffffff">
        🌱 ১০ জাতের বীজ
      </text>
    </g>
  </g>
</svg>
