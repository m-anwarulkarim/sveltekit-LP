<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="uvGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="#f8fafc" />
  <!-- Glow effect -->
  <circle cx="60" cy="60" r="38" fill="url(#uvGlow)" />
  <g transform="translate(36, 20)">
    <!-- Hanging loop -->
    <path d="M 24 10 A 10 10 0 0 0 24 -2 A 10 10 0 0 0 24 10" fill="none" stroke="#64748b" stroke-width="3" />
    <!-- Top Cap -->
    <path d="M 6 12 Q 24 6 42 12 L 40 20 L 8 20 Z" fill="#0f172a" />
    <!-- Inner UV Grid -->
    <rect x="12" y="20" width="24" height="42" fill="#7c3aed" rx="4" />
    <line x1="16" y1="20" x2="16" y2="62" stroke="#e9d5ff" stroke-width="1.5" />
    <line x1="24" y1="20" x2="24" y2="62" stroke="#e9d5ff" stroke-width="2.5" />
    <line x1="32" y1="20" x2="32" y2="62" stroke="#e9d5ff" stroke-width="1.5" />
    <!-- Outer Protective Grille Bars -->
    <rect x="8" y="20" width="32" height="44" rx="4" fill="none" stroke="#334155" stroke-width="3" />
    <line x1="8" y1="30" x2="40" y2="30" stroke="#334155" stroke-width="2" />
    <line x1="8" y1="42" x2="40" y2="42" stroke="#334155" stroke-width="2" />
    <line x1="8" y1="54" x2="40" y2="54" stroke="#334155" stroke-width="2" />
    <!-- Bottom Base -->
    <path d="M 6 64 L 42 64 L 44 76 Q 24 80 4 76 Z" fill="#0f172a" />
    <circle cx="24" cy="70" r="2.5" fill="#10b981" />
  </g>
</svg>
